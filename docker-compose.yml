services:
    app:
        build:
            context: .
            args:
                # Set to your sub-path (e.g. /feedback) and rebuild the image.
                NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            NODE_ENV: production
            DB_PATH: /app/data/feedback.db
            SCREENSHOTS_DIR: /app/screenshots
        volumes:
            - ./data:/app/data
            - ./screenshots:/app/screenshots
        restart: unless-stopped
